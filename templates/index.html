<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>People Directory</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">People operations</p>
          <h1>Employee directory</h1>
          <p class="lede">
            Keep your team information clear, current, and easy to find.
          </p>
        </div>
        <div class="stat">
          <strong id="employee-count">0</strong><span>team members</span>
        </div>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="theme-label">Dark mode</span>
        </button>
      </header>

      <section class="workspace">
        <form id="employee-form" class="form-panel">
          <div class="panel-heading">
            <h2 id="form-title">Add employee</h2>
            <button id="cancel-edit" class="text-button hidden" type="button">
              Cancel
            </button>
          </div>
          <input id="employee-id" type="hidden" />
          <label
            >Full name<input id="name" required autocomplete="name"
          /></label>
          <label
            >Work email<input
              id="email"
              type="email"
              required
              autocomplete="email"
          /></label>
          <div class="two-column">
            <label>Department<input id="department" required /></label
            ><label>Role<input id="role" required /></label>
          </div>
          <label
            >Annual salary<input
              id="salary"
              type="number"
              min="0"
              step="0.01"
              required
          /></label>
          <button class="primary-button" type="submit">
            <span id="submit-label">Add employee</span
            ><span aria-hidden="true">+</span>
          </button>
          <p id="form-message" class="message" role="status"></p>
        </form>

        <section class="directory-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Current roster</p>
              <h2>Everyone at a glance</h2>
            </div>
            <input
              id="search"
              class="search"
              type="search"
              placeholder="Search people..."
            />
          </div>
          <div id="employee-list" class="employee-list">
            <p class="empty-state">Loading your directory...</p>
          </div>
        </section>
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
